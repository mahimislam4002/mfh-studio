function taskViewMarkup(items,mode){if(mode==='Board view'){let stages=['Not started','In progress','Done'];return `<div class="task-board">${stages.map(s=>{let list=items.filter(t=>(t.done?'Done':t.status).toLowerCase()===s.toLowerCase());return `<section class="task-lane"><h3>${s} <span>${list.length}</span></h3>${list.length?list.map(t=>`<article class="task-card"><b>${esc(t.title)}</b><small>${esc(t.project)} · ${esc(t.due)}</small><div class="task-card-foot">${pill(t.priority)}<button class="check ${t.done?'on':''}" data-toggle-task="${t.id}">${t.done?'✓':''}</button></div></article>`).join(''):'<p class="smallmuted">No tasks</p>'}</section>`}).join('')}</div>`}if(mode==='Calendar view'){let dates=[...new Set(items.map(t=>t.due||'No date'))];return `<div class="calendar-list">${dates.length?dates.map(d=>`<section class="calendar-day"><h3>${esc(d)}</h3>${taskRows(items.filter(t=>(t.due||'No date')===d))}</section>`).join(''):'<div class="empty">No tasks scheduled.</div>'}</div>`}return taskRows(items)}

 ${v?'on':''}" data-habit="${esc(n)}">${v?'✓':''}</button>${esc(n)}</div>`).join('')}</div><div class="rowmeta" style="margin-top:10px">Today’s score: ${score} of 6</div>`,`<button class="quiet" data-view="habits">View tracker →</button>`)}${panel('🎯 Goals',db.goals.slice(0,2).map(g=>`<div class="goalcard"><div class="goalhead"><b>${esc(g.name)}</b>${pill(g.category)}</div><div class="bar"><i style="width:${g.progress}%"></i></div><div class="rowmeta">${g.progress}% · Target ${esc(g.target)}</div></div>`).join(''),`<button class="quiet" data-view="goals">All goals →</button>`)}</div></div><div class="stack">${panel('🚀 Active Projects',db.projects.filter(p=>p.status==='In Progress').map(p=>`<div class="projectrow"><div class="projecticon">◈</div><div class="rowmain"><div class="rowtitle">${esc(p.name)}</div><div class="rowmeta">${pill(p.area)} ${esc(p.timeline)}</div><div class="bar"><i style="width:${p.progress}%"></i></div></div><b class="smallmuted">${p.progress}%</b></div>`).join(''),`<button class="quiet" data-view="projects">All projects →</button>`)}${panel('📅 Daily Planner',`<div class="smallmuted">TOP 3 PRIORITIES</div><p style="white-space:pre-line;font-size:10px">${esc(db.planner.top)}</p><div class="rowmeta">Energy: ${pill(db.planner.energy)}</div>`,`<button class="quiet" data-view="planner">Open planner →</button>`)}${panel('💡 Content Ideas',db.ideas.slice(0,2).map(i=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(i.title)}</div><div class="rowmeta">${pill(i.status)} ${pill(i.format)}</div></div></div>`).join(''),`<button class="quiet" data-view="content">Content pipeline →</button>`)}${panel('📓 Recent Notes',db.notes.slice(0,2).map(n=>`<div class="note-card" data-open-note="${n.id}"><h3>${esc(n.title)} ${n.favorite?'★':''}</h3><p>${esc(n.body)}</p><div class="rowmeta">${pill(n.type)} ${n.tags.map(pill).join('')}</div></div>`).join(''),`<button class="quiet" data-view="notes">Knowledge base →</button>`)}</div></div>`}
function renderCapture(){let rows=db.captures;return `${head('Quick Capture','A fast inbox for thoughts, tasks, ideas, links and questions. Capture first; process once a day.',`<button class="button primary" data-action="quick-capture">＋ Capture something</button>`)}<div class="filterrow"><select id="captureFilter"><option>All items</option><option>Unprocessed</option><option>Processed</option></select></div>${panel('Inbox · '+rows.filter(c=>!c.processed).length+' to process',rows.length?rows.map(c=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(c.title)}</div><div class="rowmeta">${pill(c.type)} <span>${esc(c.date)}</span> ${c.processed?pill('Processed'):''}</div></div>${!c.processed?`<button class="button soft" data-process="${c.id}">Process</button>`:`<button class="button" data-unprocess="${c.id}">Move back</button>`}<button class="quiet" data-delete-capture="${c.id}">Delete</button></div>`).join(''):'<div class="empty">Nothing in your inbox yet. Use Quick Capture to save the first thought.</div>')}</section>`}
function renderTasks(){let rows=db.tasks;return `${head('Tasks','Every next action, connected to a project with status, priority, due date and context.',`<button class="button primary" data-action="new-task">＋ New task</button>`)}<div class="filterrow"><select id="taskFilter"><option>All tasks</option><option>Open</option><option>Done</option></select><select id="priorityFilter"><option>Any priority</option><option>High</option><option>Medium</option><option>Low</option></select><select id="taskView"><option>List view</option><option>Board view</option><option>Calendar view</option></select></div>${panel('Task list',`<div id="taskRows">${taskViewMarkup(rows,'List view')}</div>`)}`}
function renderProjects(){return `${head('Projects','Bigger outcomes made of tasks. Keep status, area, timeline, goals and related work together.',`<button class="button primary" data-action="new-project">＋ New project</button>`)}<div class="cards">${db.projects.map(p=>`<article class="panel"><div class="panelhead"><h2>◈ ${esc(p.name)}</h2>${pill(p.status)}</div><div class="rowmeta">${pill(p.area)} ${pill(p.priority)} <span>${esc(p.timeline)}</span></div><p class="smallmuted">${esc(p.notes)}</p><div class="bar"><i style="width:${p.progress}%"></i></div><div class="panelhead" style="margin:8px 0 0"><span class="smallmuted">${p.progress}% complete</span><button class="quiet" data-bump-project="${p.id}">Update progress +10</button></div></article>`).join('')}</div>`}
function renderGoals(){return `${head('Goals','Long-term targets with progress, category, target date and a clear reason why it matters.',`<button class="button primary" data-action="new-goal">＋ New goal</button>`)}<div class="goalsgrid">${db.goals.map(g=>`<article class="panel"><div class="goalhead"><b>${esc(g.name)}</b>${pill(g.category)}</div><p class="smallmuted">${esc(g.why)}</p><div class="bar"><i style="width:${g.progress}%"></i></div><div class="rowmeta">${g.progress}% complete · ${pill(g.status)} · Target ${esc(g.target)}</div><button class="button soft" style="margin-top:10px" data-bump-goal="${g.id}">Update progress +5%</button></article>`).join('')}</div>`}
function renderHabits(){let score=Object.values(db.habits).filter(Boolean).length;return `${head('Habit Tracker','Six daily check-ins. Your score updates automatically as you build consistency.',`<span class="datechip">Today · ${today}</span>`)}${panel(`Today’s habits · ${score} / 6 completed`,`<div class="habitgrid">${Object.entries(db.habits).map(([n,v])=>`<div class="habit"><button class="check ${v?'on':''}" data-habit="${esc(n)}">${v?'✓':''}</button>${esc(n)}</div>`).join('')}</div><div class="bar" style="height:8px;margin-top:15px"><i style="width:${score/6*100}%"></i></div><p class="smallmuted">Daily score: ${Math.round(score/6*100)}%</p>`)}<div style="height:14px"></div>${panel('Habit check-in history','<div class="weekgrid">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map((d,i)=>`<div class="day ${i===0?'current':''}">${d}<b>${i===0?score:i===1?'4':'—'}</b></div>`).join('')+'</div><p class="smallmuted">Keep the score encouraging, not punishing. Missed days are a chance to begin again.</p>')}`}
function renderPlanner(){return `${head('Daily Planner','Choose your top three, sketch the schedule, and end the day with wins and gratitude.',`<span class="datechip">${today}</span>`)}${panel('Today’s page',`<div class="filterrow"><label class="field" style="margin:0;min-width:180px"><span>Energy</span><select id="plannerEnergy"><option ${db.planner.energy==='High'?'selected':''}>High</option><option ${db.planner.energy==='Medium'?'selected':''}>Medium</option><option ${db.planner.energy==='Low'?'selected':''}>Low</option></select></label></div><div class="planner"><div class="plannerfield"><label>Top 3 Priorities</label><textarea id="plannerTop">${esc(db.planner.top)}</textarea></div><div class="plannerfield"><label>Schedule Notes</label><textarea id="plannerSchedule">${esc(db.planner.schedule)}</textarea></div><div class="plannerfield"><label>Wins</label><textarea id="plannerWins" placeholder="What went well today?">${esc(db.planner.wins)}</textarea></div><div class="plannerfield"><label>Gratitude</label><textarea id="plannerGratitude" placeholder="One thing you appreciate…">${esc(db.planner.gratitude)}</textarea></div></div><button class="button primary" style="margin-top:12px" data-action="save-planner">Save today’s planner</button>`)}<p class="smallmuted">Start your morning with priorities and close the day by recording one win.</p>`}
function renderWeekly(){return `${head('Weekly Review','A short look back at your wins and lessons, then a clear plan for next week.',`<button class="button primary" data-action="save-weekly">Save review</button>`)}${panel('Week of Oct 12',`<div class="planner"><div class="plannerfield"><label>Weekly Focus</label><textarea id="weekFocus">${esc(db.weekly.focus)}</textarea></div><div class="plannerfield"><label>Rating</label><select id="weekRating">${['Excellent','Good','Average','Tough'].map(x=>`<option ${x===db.weekly.rating?'selected':''}>${x}</option>`).join('')}</select></div><div class="plannerfield"><label>Key Wins</label><textarea id="weekWins" placeholder="What are you proud of?">${esc(db.weekly.wins)}</textarea></div><div class="plannerfield"><label>Lessons Learned</label><textarea id="weekLessons" placeholder="What did you learn?">${esc(db.weekly.lessons)}</textarea></div><div class="plannerfield" style="grid-column:1/-1"><label>Next Week Plan</label><textarea id="weekNext" placeholder="What will you focus on next week?">${esc(db.weekly.next)}</textarea></div></div><button class="button primary" style="margin-top:12px" data-action="save-weekly">Save weekly review</button>`)}<p class="smallmuted">Review projects and goals, then choose the next useful actions.</p>`}
function renderNotes(){return `${head('Notes & Knowledge Base','Meeting notes, learning notes, journals, references and ideas—connected to projects and tags.',`<button class="button primary" data-action="new-note">＋ New note</button>`)}<div class="filterrow"><select id="noteType"><option>All types</option>${['Idea','Meeting Note','Learning Note','Journal','Reference','Book Note'].map(x=>`<option>${x}</option>`).join('')}</select><select id="noteSort"><option>Recently updated</option><option>Favorites first</option></select></div><div class="columns" id="noteGrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${db.notes.map(n=>`<article class="panel note-card" data-note-search="${esc((n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase())}"><div class="panelhead"><h2>${esc(n.title)}</h2><button class="quiet" data-favorite="${n.id}">${n.favorite?'★':'☆'}</button></div><p>${esc(n.body)}</p><div class="rowmeta">${pill(n.type)} ${n.tags.map(pill).join('')} ${n.project?pill(n.project):''}</div><button class="quiet" data-edit-note="${n.id}">Open & edit →</button></article>`).join('')||'<div class="empty">No notes yet. Create the first one.</div>'}</div>`}
function renderContent(){let stages=['Inbox','Scripting','Creating','Scheduled','Published'];return `${head('Content Ideas Inbox','Move ideas from a rough hook to a scheduled and published piece.',`<button class="button primary" data-action="new-idea">＋ New idea</button>`)}<div class="board">${stages.map(s=>`<section class="boardcol"><h3>${s} · ${db.ideas.filter(i=>i.status===s).length}</h3>${db.ideas.filter(i=>i.status===s).map(i=>`<article class="boarditem"><b>${esc(i.title)}</b><small>${esc(i.format)} · ${esc(i.platform)}</small><small>Hook: ${esc(i.hook||'Add a hook')}</small><small>Priority: ${esc(i.priority)} ${i.date?'· '+esc(i.date):''}</small><select data-idea-status="${i.id}">${stages.map(x=>`<option ${x===i.status?'selected':''}>${x}</option>`).join('')}</select></article>`).join('')}</section>`).join('')}</div><p class="smallmuted">Fields: Idea · Format · Platform · Hook / Angle · Priority · Publish Date · Status.</p>`}
function renderResources(){return `${head('Resources & Bookmarks','Keep useful articles, videos, tools, courses, books, podcasts and templates.',`<button class="button primary" data-action="new-resource">＋ Save resource</button>`)}<div class="filterrow"><select id="resourceFilter"><option>All categories</option>${['Article','Video','Tool','Course','Book','Podcast','Template'].map(x=>`<option>${x}</option>`).join('')}</select><select><option>All ratings</option>${['5 - Essential','4 - Great','3 - Useful','2 - Okay','1 - Skip'].map(x=>`<option>${x}</option>`).join('')}</select></div>${panel('Saved resources',db.resources.map(r=>`<div class="row"><div class="rowmain"><div class="rowtitle"><a class="resource-link" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a></div><div class="rowmeta">${pill(r.category)} ${pill(r.status)} ${pill(r.rating)} ${r.tags.map(pill).join('')}</div></div><button class="quiet" data-delete-resource="${r.id}">Remove</button></div>`).join('')||'<div class="empty">Save a useful link or resource.</div>')}`}
function renderStart(){return `${head('Start Here','A short guide to using your Second Brain every day.')}${panel('Welcome to your Second Brain','<p class="smallmuted">One place for tasks, projects, notes, goals, habits, content ideas and daily planning. Keep your information connected and easy to find.</p>')}<div style="height:12px"></div>${panel('Get started in 5 steps',`<div class="guidegrid"><div class="guide"><h3>1 · Look around</h3><p>Use Home to see today's focus and every key area.</p></div><div class="guide"><h3>2 · Add a project</h3><p>Create a project for a result that takes more than one step.</p></div><div class="guide"><h3>3 · Add three tasks</h3><p>Link each task to a project and set status, priority and due date.</p></div><div class="guide"><h3>4 · Capture freely</h3><p>Save thoughts, tasks, ideas, links and questions to Quick Capture.</p></div><div class="guide"><h3>5 · Make it yours</h3><p>Use tags and areas; start with a few features and add more as needed.</p></div></div>`)}<div style="height:12px"></div><div class="guidegrid"><article class="guide"><h3>Morning · 5 minutes</h3><ol><li>Open today's Daily Planner.</li><li>Write your Top 3 Priorities.</li><li>Check open tasks and choose what fits.</li></ol></article><article class="guide"><h3>During the day</h3><ol><li>Capture new thoughts without stopping.</li><li>Update task status as you work.</li><li>Save learning and meeting notes.</li></ol></article><article class="guide"><h3>Evening · 5 minutes</h3><ol><li>Check off today's habits.</li><li>Record one win and gratitude.</li><li>Process Inbox into Tasks, Notes or Ideas.</li></ol></article></div><div style="height:12px"></div>${panel('Weekly routine · 15 minutes','<p class="smallmuted">Record key wins and lessons, update goal progress, check active projects, choose the next tasks and set next week’s focus.</p>')}`}

function renderSettings(){return `${head('Settings & Export','Keep your information portable and manage your personal workspace.')}${panel('Your data, your choice',`<p class="smallmuted">Export your Second Brain as JSON, Markdown or CSV. An import flow can bring over your Notion data while preserving source relationships.</p><div class="filterrow"><button class="button primary" data-action="export-json">Export JSON</button><button class="button" data-action="export-csv">Export CSV</button><button class="button" data-action="export-md">Export Markdown</button><button class="button" data-action="import-demo">Import from Notion</button></div>`)}<div style="height:12px"></div>${panel('AI connections',`<p class="smallmuted">AI is optional. When configured, answers should cite the notes they came from. Missing API credentials should never block the rest of your Second Brain.</p><button class="button" data-action="ai-demo">Check AI status</button>`)}`}
function renderSearch(q){let needle=q.trim().toLowerCase();let groups=[['Tasks','tasks',db.tasks,x=>`${x.title} ${x.status} ${x.priority} ${x.project} ${x.context}`],['Projects','projects',db.projects,x=>`${x.name} ${x.area} ${x.status} ${x.notes}`],['Goals','goals',db.goals,x=>`${x.name} ${x.category} ${x.status} ${x.why}`],['Notes & Knowledge Base','notes',db.notes,x=>`${x.title} ${x.type} ${x.tags.join(' ')} ${x.body}`],['Content Ideas','content',db.ideas,x=>`${x.title} ${x.format} ${x.platform} ${x.hook} ${x.status}`],['Resources & Bookmarks','resources',db.resources,x=>`${x.name} ${x.category} ${x.status} ${x.tags.join(' ')}`],['Quick Capture','capture',db.captures,x=>`${x.title} ${x.type} ${x.processed?'processed':'unprocessed'}`]];let matches=groups.map(([label,key,items,text])=>({label,key,items:items.filter(x=>text(x).toLowerCase().includes(needle))})).filter(g=>g.items.length);return `${head('Search Results',needle?`Matches for “${esc(q)}” across your Second Brain.`:'Type a word above and press Enter.')}${matches.length?matches.map(g=>panel(`${g.label} · ${g.items.length}`,`${g.items.map(x=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(x.title||x.name)}</div><div class="rowmeta">${esc(x.status||x.type||x.category||'')}</div></div><button class="quiet" data-view="${g.key}">Open section →</button></div>`).join('')}`)).join(''):`<div class="empty">${needle?'No matching items. Try another search.':'Enter a search term to find tasks, projects, goals, notes, content ideas, resources and captures.'}</div>`}`}
function renderHomeV2(){let open=db.tasks.filter(t=>!t.done).length,active=db.projects.filter(p=>p.status==='In Progress').length,notes=db.notes.length,inbox=db.captures.filter(c=>!c.processed).length;let tabs=[['Overview','home'],['Inbox','capture'],['Notes','notes'],['Tasks','tasks'],['Projects','projects'],['Goals','goals'],['Areas','areas']];return `<section class="hero"><div class="hero-kicker">PERSONAL PRODUCTIVITY WORKSPACE</div><h1>🧠 Ultimate Second Brain</h1><p>Capture ideas · organize knowledge · track projects & goals — your personal second brain.</p><div class="hero-actions"><button class="button hero-button" data-action="quick-capture">＋ Quick Capture</button><button class="button hero-button secondary" data-view="start">Explore User Guide</button></div></section><nav class="dash-tabs" aria-label="Second Brain sections">${tabs.map(([label,key])=>`<button class="dash-tab ${key==='home'?'selected':''}" data-view="${key}">${label}</button>`).join('')}</nav><div class="statgrid"><button class="stat stat-dark stat-purple" data-view="capture"><small>Inbox</small><strong>${inbox}</strong><em>Items to process　↗</em></button><button class="stat stat-dark stat-blue" data-view="tasks"><small>Open tasks</small><strong>${open}</strong><em>Next actions　↗</em></button><button class="stat stat-dark stat-indigo" data-view="notes"><small>Notes</small><strong>${notes}</strong><em>Knowledge saved　↗</em></button><button class="stat stat-dark stat-teal" data-view="projects"><small>Active projects</small><strong>${active}</strong><em>In progress　↗</em></button></div><div class="columns"><div class="stack">${panel('✨ Today’s focus',`<div class="focus-form"><input id="focusInput" value="${esc(db.focus||'')}" placeholder="What matters most today?"><button class="button primary" data-action="save-focus">Save focus</button></div><div class="focus-hint">Keep the day intentional. Your focus is saved to this workspace.</div>`)}${panel('⚡ Quick Capture',`<div class="capturebox"><div class="cicon">✎</div><div><b>Dump a thought, task, idea, link or question</b>Process it later, when you have a moment.</div><button class="button primary" data-action="quick-capture">Capture</button></div><div style="margin-top:9px">${db.captures.filter(c=>!c.processed).slice(0,3).map(c=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(c.title)}</div><div class="rowmeta">${pill(c.type)} <span>${esc(c.date)}</span></div></div><button class="quiet" data-process="${c.id}">Process</button></div>`).join('')||'<div class="empty">Your inbox is clear. Capture something when it comes up.</div>'}</div>`,`<button class="quiet" data-view="capture">Open inbox →</button>`)}${panel('✅ Today’s Focus · Tasks',taskRows(db.tasks.filter(t=>!t.done).slice(0,3)),`<button class="quiet" data-view="tasks">All tasks →</button>`)}<div class="columns" style="grid-template-columns:1fr 1fr">${panel('🔁 Habit Tracker',`<div class="habitgrid">${Object.entries(db.habits).map(([n,v])=>`<div class="habit"><button class="check ${v?'on':''}" data-habit="${esc(n)}">${v?'✓':''}</button>${esc(n)}</div>`).join('')}</div><div class="rowmeta" style="margin-top:10px">Today’s score: ${Object.values(db.habits).filter(Boolean).length} of 6</div>`,`<button class="quiet" data-view="habits">View tracker →</button>`)}${panel('🎯 Goals',db.goals.slice(0,2).map(g=>`<div class="goalcard"><div class="goalhead"><b>${esc(g.name)}</b>${pill(g.category)}</div><div class="bar"><i style="width:${g.progress}%"></i></div><div class="rowmeta">${g.progress}% · Target ${esc(g.target)}</div></div>`).join(''),`<button class="quiet" data-view="goals">All goals →</button>`)}</div></div><div class="stack">${panel('🚀 Active Projects',db.projects.filter(p=>p.status==='In Progress').map(p=>`<div class="projectrow"><div class="projecticon">◈</div><div class="rowmain"><div class="rowtitle">${esc(p.name)}</div><div class="rowmeta">${pill(p.area)} ${esc(p.timeline)}</div><div class="bar"><i style="width:${p.progress}%"></i></div></div><b class="smallmuted">${p.progress}%</b></div>`).join(''),`<button class="quiet" data-view="projects">All projects →</button>`)}${panel('📅 Daily Planner',`<div class="smallmuted">TOP 3 PRIORITIES</div><p style="white-space:pre-line;font-size:12px">${esc(db.planner.top)}</p><div class="rowmeta">Energy: ${pill(db.planner.energy)}</div>`,`<button class="quiet" data-view="planner">Open planner →</button>`)}${panel('📆 Weekly Review',`<b>${esc(db.weekly.focus||'Set this week’s focus')}</b><p class="smallmuted">${esc(db.weekly.week||'This week')} · ${esc(db.weekly.rating||'Not rated')}</p>`,`<button class="quiet" data-view="weekly">Review this week →</button>`)}${panel('💡 Content Ideas',db.ideas.slice(0,2).map(i=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(i.title)}</div><div class="rowmeta">${pill(i.status)} ${pill(i.format)}</div></div></div>`).join(''),`<button class="quiet" data-view="content">Content pipeline →</button>`)}${panel('📓 Recent Notes',db.notes.slice(0,2).map(n=>`<div class="note-card" data-open-note="${n.id}"><h3>${esc(n.title)} ${n.favorite?'★':''}</h3><p>${esc(n.body)}</p><div class="rowmeta">${pill(n.type)} ${n.tags.map(pill).join('')}</div></div>`).join(''),`<button class="quiet" data-view="notes">Knowledge base →</button>`)}</div></div>`}
function renderAreas(){let areas=['Work','Personal','Health','Finance','Learning','Business'];return `${head('Areas','Browse projects by the part of life or work they support.',`<button class="button primary" data-action="new-project">＋ New project</button>`)}<div class="area-grid">${areas.map((a,i)=>{let count=db.projects.filter(p=>p.area===a).length;return `<button class="area-card area-${i}" data-area="${esc(a)}"><span>${['▧','◌','✚','$','⌘','✦'][i]}</span><b>${a}</b><strong>${count}</strong><small>${count===1?'project':'projects'}</small></button>`}).join('')}</div><div id="areaProjects">${panel('Projects across all areas',db.projects.map(p=>`<div class="row"><div class="rowmain"><div class="rowtitle">${esc(p.name)}</div><div class="rowmeta">${pill(p.area)} ${pill(p.status)}</div></div></div>`).join('')||'<div class="empty">No projects yet. Add a project to organize your work by area.</div>')}</div>`}
function renderGuideV2(){let guides=[['Quick Capture','capture','Write any thought, task, idea, link, or question here. Process it later into a task, note, or content idea.'],['Tasks','tasks','Add the next action you will do. Set status, priority, due date, context, and the related project. Check it off when complete.'],['Projects','projects','Use a project for a result that takes multiple steps. Choose an area, status, priority, timeline, and notes; connect related tasks, goals, and notes.'],['Goals','goals','Write a longer-term outcome. Add category, progress, target date, related projects, and why it matters so you can track meaningful progress.'],['Habit Tracker','habits','Check the six habits you complete each day. The score shows your daily total; use the history to spot consistency and patterns.'],['Daily Planner','planner','Record your energy, gratitude, schedule notes, top three priorities, and wins. Choose the three most important tasks each morning.'],['Weekly Review','weekly','At week’s end, record your focus, wins, lessons, next-week plan, and rating. Use it to learn what worked and plan the next week.'],['Notes & Knowledge Base','notes','Save meeting notes, learning, journal entries, ideas, references, and book notes. Use type, tags, project, and favorite to find them later.'],['Content Ideas Inbox','content','Add the idea, format, platform, hook, priority, and publish date. Move each item through Inbox, Scripting, Creating, Scheduled, and Published.'],['Resources & Bookmarks','resources','Save useful links, articles, videos, tools, courses, books, podcasts, and templates. Add category, rating, status, and tags for later review.']];return `${head('User Guide','A plain-language guide to what each section is for, what to enter, and how it helps.',`<button class="button primary" data-action="quick-capture">＋ Capture an item</button>`)}${panel('A simple daily workflow','<p class="smallmuted">Capture new information quickly. Process your inbox once a day. Put multi-step outcomes in Projects, their next actions in Tasks, and long-term outcomes in Goals.</p>')}<div class="guidegrid guide-cards">${guides.map(([title,key,desc])=>`<article class="guide guide-detail"><div class="guide-detail-head"><h3>${title}</h3><button class="quiet" data-view="${key}">Open page →</button></div><p>${desc}</p></article>`).join('')}</div><div class="guidegrid guide-routines"><article class="guide"><h3>☀️ Morning · 5 minutes</h3><ol><li>Open Daily Planner.</li><li>Write your top three priorities.</li><li>Choose tasks that fit your time and energy.</li></ol></article><article class="guide"><h3>🌙 Evening · 5 minutes</h3><ol><li>Check today’s habits.</li><li>Record a win and something you appreciate.</li><li>Process your Quick Capture inbox.</li></ol></article><article class="guide"><h3>📅 Weekly · 15 minutes</h3><ol><li>Record wins and lessons in Weekly Review.</li><li>Update project and goal progress.</li><li>Choose next week’s focus and actions.</li></ol></article></div>${panel('Common terms','<p class="smallmuted"><b>Relation:</b> a link between a project and its tasks, goals, or notes. <b>Status:</b> the current stage of an item. <b>Priority:</b> what deserves attention first. <b>Context:</b> where or how a task can be done, such as a call or deep work. <b>Tags:</b> labels that help you find related notes and resources.</p>')}`}
function render(){document.querySelector('#crumb').textContent=views[view];const fn={home:renderHomeV2,start:renderGuideV2,capture:renderCapture,tasks:renderTasks,projects:renderProjects,goals:renderGoals,habits:renderHabits,planner:renderPlanner,weekly:renderWeekly,notes:renderNotes,content:renderContent,resources:renderResources,databases:renderDatabases,settings:renderSettings,search:()=>renderSearch(lastQuery),areas:renderAreas}[view];document.querySelector('#page').innerHTML=fn();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelector('#taskBadge').textContent=db.tasks.filter(t=>!t.done).length;document.querySelector('#captureBadge').textContent=db.captures.filter(c=>!c.processed).length;document.querySelector('#backBtn').classList.toggle('disabled',view==='home'||viewHistory.length===0)}
let viewHistory=[];function navTo(v){if(!views[v]||v===view)return;viewHistory.push(view);view=v;render();window.scrollTo(0,0)}function goBack(){if(viewHistory.length)view=viewHistory.pop();else view='home';render();window.scrollTo(0,0)}
function openModal(type,id=null){let title='';let fields='';let action='';if(type==='capture'){title='Quick Capture';fields=`<label class="field"><span>Capture</span><textarea name="title" required placeholder="Thought, task, idea, link or question…"></textarea></label><label class="field"><span>Type</span><select name="type">${['Thought','Task','Idea','Link','Question'].map(x=>`<option>${x}</option>`)}</select></label>`;action='save-capture'}if(type==='task'){title='New Task';fields=`<label class="field"><span>Task</span><input name="title" required placeholder="What needs to be done?"></label><label class="field"><span>Project</span><select name="project">${db.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></label><label class="field"><span>Priority</span><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label class="field"><span>Due Date</span><input name="due" type="date"></label><label class="field"><span>Context</span><select name="context"><option>Deep Work</option><option>Quick Win</option><option>Call</option><option>Errand</option><option>Online</option></select></label>`;action='save-task'}if(type==='project'){title='New Project';fields=`<label class="field"><span>Name</span><input name="name" required></label><label class="field"><span>Area</span><select name="area">${['Work','Personal','Health','Finance','Learning','Business'].map(x=>`<option>${x}</option>`)}</select></label><label class="field"><span>Notes</span><textarea name="notes"></textarea></label>`;action='save-project'}if(type==='goal'){title='New Goal';fields=`<label class="field"><span>Goal</span><input name="name" required></label><label class="field"><span>Category</span><select name="category">${['Career','Health','Finance','Learning','Personal','Business'].map(x=>`<option>${x}</option>`)}</select></label><label class="field"><span>Why It Matters</span><textarea name="why"></textarea></label><label class="field"><span>Target Date</span><input name="target" type="date"></label>`;action='save-goal'}if(type==='note'){title=id?'Edit Note':'New Note';let n=db.notes.find(x=>x.id===id)||{};fields=`<label class="field"><span>Title</span><input name="title" required value="${esc(n.title||'')}"></label><label class="field"><span>Type</span><select name="type">${['Idea','Meeting Note','Learning Note','Journal','Reference','Book Note'].map(x=>`<option ${n.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Tags (comma separated)</span><input name="tags" value="${esc((n.tags||[]).join(', '))}"></label><label class="field"><span>Note</span><textarea name="body">${esc(n.body||'')}</textarea></label>`;action=id?'update-note:'+id:'save-note'}if(type==='idea'){title='New Content Idea';fields=`<label class="field"><span>Idea</span><input name="title" required></label><label class="field"><span>Format</span><select name="format">${['Video','Reel / Short','Carousel','Post','Article','Thread'].map(x=>`<option>${x}</option>`)}</select></label><label class="field"><span>Platform</span><input name="platform" placeholder="YouTube, Instagram, TikTok…"></label><label class="field"><span>Hook / Angle</span><textarea name="hook"></textarea></label>`;action='save-idea'}if(type==='resource'){title='Save Resource';fields=`<label class="field"><span>Name</span><input name="name" required></label><label class="field"><span>Link</span><input name="link" type="url" placeholder="https://"></label><label class="field"><span>Category</span><select name="category">${['Article','Video','Tool','Course','Book','Podcast','Template'].map(x=>`<option>${x}</option>`)}</select></label><label class="field"><span>Rating</span><select name="rating">${['5 - Essential','4 - Great','3 - Useful','2 - Okay','1 - Skip'].map(x=>`<option>${x}</option>`)}</select></label>`;action='save-resource'}document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalDesc').textContent='Your changes are saved in this interactive preview.';document.querySelector('#modalBody').innerHTML=`<form id="form">${fields}</form>`;document.querySelector('#modalback').classList.add('show');document.querySelector('#modalSave').dataset.save=action}
function closeModal(){document.querySelector('#modalback').classList.remove('show')}
function processCapture(id,done=true){let c=db.captures.find(x=>x.id==id);if(c)c.processed=done;save();render();toast(done?'Moved out of inbox':'Returned to inbox')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Export downloaded')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b){navTo(b.dataset.view);return}b=e.target.closest('[data-action]');if(b){let a=b.dataset.action;if(a==='go-back')goBack();else if(a==='exit-portfolio'){let target=window.PORTFOLIO_HOME_URL||'';if(target)window.location.assign(target);else toast('Preview mode: connect the Portfolio home route.')}else if(a==='quick-capture')openModal('capture');else if(a==='new-note')openModal('note');else if(a==='new-task')openModal('task');else if(a==='new-project')openModal('project');else if(a==='new-goal')openModal('goal');else if(a==='new-idea')openModal('idea');else if(a==='new-resource')openModal('resource');else if(a==='close')closeModal();else if(a==='save-focus'){db.focus=document.querySelector('#focusInput').value.trim();save();render();toast('Today’s focus saved')}else if(a==='save-planner'){db.planner={top:document.querySelector('#plannerTop').value,schedule:document.querySelector('#plannerSchedule').value,wins:document.querySelector('#plannerWins').value,gratitude:document.querySelector('#plannerGratitude').value,energy:document.querySelector('#plannerEnergy').value};save();render();toast('Daily Planner saved')}else if(a==='save-weekly'){db.weekly={week:'Week of Oct 12',focus:document.querySelector('#weekFocus').value,wins:document.querySelector('#weekWins').value,lessons:document.querySelector('#weekLessons').value,next:document.querySelector('#weekNext').value,rating:document.querySelector('#weekRating').value};save();toast('Weekly Review saved')}else if(a==='export-json')download('second-brain-export.json',JSON.stringify(db,null,2),'application/json');else if(a==='export-csv'){let csv='Type,Title,Details\n'+db.tasks.map(t=>`Task,"${t.title.replaceAll('"','""')}","${t.status}"`).join('\n')+'\n'+db.notes.map(n=>`Note,"${n.title.replaceAll('"','""')}","${n.body.replaceAll('"','""')}"`).join('\n');download('second-brain-export.csv',csv,'text/csv')}else if(a==='export-md'){let md='# Second Brain Export\n\n## Notes\n'+db.notes.map(n=>`### ${n.title}\n\n${n.body}\n`).join('\n')+'\n## Tasks\n'+db.tasks.map(t=>`- [${t.done?'x':' '}] ${t.title} — ${t.status}, ${t.priority}, ${t.due}`).join('\n');download('second-brain-export.md',md,'text/markdown')}else if(a==='import-demo')toast('Import flow requires the real website integration.');else if(a==='ai-demo')toast('AI is optional; connect a server-side API to enable it.');return}
let id;if((b=e.target.closest('[data-toggle-task]'))){let t=db.tasks.find(x=>x.id==b.dataset.toggleTask);t.done=!t.done;t.status=t.done?'Done':'Not started';save();render();return}if((b=e.target.closest('[data-habit]'))){db.habits[b.dataset.habit]=!db.habits[b.dataset.habit];save();render();return}if((b=e.target.closest('[data-process]'))){processCapture(b.dataset.process,true);return}if((b=e.target.closest('[data-unprocess]'))){processCapture(b.dataset.unprocess,false);return}if((b=e.target.closest('[data-delete-capture]'))){db.captures=db.captures.filter(x=>x.id!=b.dataset.deleteCapture);save();render();toast('Inbox item deleted');return}if((b=e.target.closest('[data-bump-goal]'))){let g=db.goals.find(x=>x.id==b.dataset.bumpGoal);g.progress=Math.min(100,g.progress+5);if(g.progress===100)g.status='Achieved';save();render();return}if((b=e.target.closest('[data-bump-project]'))){let p=db.projects.find(x=>x.id==b.dataset.bumpProject);p.progress=Math.min(100,p.progress+10);save();render();return}if((b=e.target.closest('[data-favorite]'))){let n=db.notes.find(x=>x.id==b.dataset.favorite);n.favorite=!n.favorite;save();render();return}if((b=e.target.closest('[data-edit-note]'))){openModal('note',b.dataset.editNote);return}if((b=e.target.closest('[data-delete-resource]'))){db.resources=db.resources.filter(x=>x.id!=b.dataset.deleteResource);save();render();toast('Resource removed');return}if((b=e.target.closest('[data-open-note]'))){openModal('note',b.dataset.openNote);return}if((b=e.target.closest('[data-area]'))){let area=b.dataset.area;document.querySelectorAll('#areaProjects .row').forEach(r=>r.style.display=r.innerText.includes(area)?'':'none');return}});
document.querySelector('#modalSave').addEventListener('click',()=>{let f=document.querySelector('#form');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));let a=document.querySelector('#modalSave').dataset.save;if(a==='save-capture')db.captures.unshift({id:Date.now(),title:d.title,type:d.type,date:'Just now',processed:false});if(a==='save-task')db.tasks.unshift({id:Date.now(),title:d.title,status:'Not started',priority:d.priority,due:d.due||'No date',context:d.context,project:d.project,done:false});if(a==='save-project')db.projects.unshift({id:Date.now(),name:d.name,area:d.area,status:'Not Started',priority:'Medium',timeline:'Set dates',progress:0,notes:d.notes});if(a==='save-goal')db.goals.unshift({id:Date.now(),name:d.name,category:d.category,progress:0,status:'Not Started',target:d.target||'Set date',why:d.why});if(a==='save-note'||a.startsWith('update-note:')){let id=a.startsWith('update-note:')?a.split(':')[1]:null;let n=id?db.notes.find(x=>x.id==id):null;let item={id:id?Number(id):Date.now(),title:d.title,type:d.type,tags:d.tags.split(',').map(x=>x.trim()).filter(Boolean),project:n?.project||'',favorite:n?.favorite||false,body:d.body};if(n)Object.assign(n,item);else db.notes.unshift(item)}if(a==='save-idea')db.ideas.unshift({id:Date.now(),title:d.title,format:d.format,platform:d.platform,priority:'Medium',status:'Inbox',date:'',hook:d.hook});if(a==='save-resource')db.resources.unshift({id:Date.now(),name:d.name,category:d.category,link:d.link||'#',rating:d.rating,status:'To Review',tags:[]});save();closeModal();render();toast('Saved to your Second Brain')});
document.addEventListener('change',e=>{if(e.target.id==='taskFilter'||e.target.id==='priorityFilter'||e.target.id==='taskView'){let status=document.querySelector('#taskFilter')?.value||'All tasks',priority=document.querySelector('#priorityFilter')?.value||'Any priority';let rows=db.tasks.filter(t=>(status==='All tasks'||status==='Open'&&!t.done||status==='Done'&&t.done)&&(priority==='Any priority'||t.priority===priority));document.querySelector('#taskRows').innerHTML=taskViewMarkup(rows,document.querySelector('#taskView')?.value||'List view')}if(e.target.dataset.ideaStatus){let i=db.ideas.find(x=>x.id==e.target.dataset.ideaStatus);i.status=e.target.value;save();render()}if(e.target.id==='captureFilter'){let v=e.target.value;document.querySelectorAll('#page [data-process],#page [data-unprocess]').forEach(btn=>{let row=btn.closest('.row');let isProcessed=row.innerText.includes('Processed');row.style.display=v==='All items'||v==='Unprocessed'&&!isProcessed||v==='Processed'&&isProcessed?'':'none'})}if(e.target.id==='noteType'){document.querySelectorAll('[data-note-search]').forEach(card=>{card.style.display=e.target.value==='All types'||card.innerText.includes(e.target.value)?'':'none'})}if(e.target.id==='resourceFilter'){document.querySelectorAll('#page .row').forEach(row=>{row.style.display=e.target.value==='All categories'||row.innerText.includes(e.target.value)?'':'none'})}});
let lastQuery='';document.querySelector('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){lastQuery=e.target.value;if(view==='search')render();else navTo('search')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#globalSearch').focus()}if(e.key==='Escape')closeModal()});
render();
</script></body></html>
