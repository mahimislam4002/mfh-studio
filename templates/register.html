{% extends "base.html" %}
{% block title %}Register - Portfolio SaaS{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <h1>Register</h1>
    <p class="subtitle">Create your portfolio website</p>

    <form method="POST" class="auth-form" enctype="multipart/form-data">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="Your name">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="+880 1XXX-XXXXXX">
        </div>
        <div class="form-group">
            <label>Profile Photo (optional)</label>
            <input type="file" name="photo_file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif">
        </div>
        <div class="form-group">
            <label>Referral Code (optional)</label>
            <input type="text" name="referral_code" placeholder="Enter referral code if you have one">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </p>
</div>
{% endblock %}
